# Deploy to one environment.
#
#   push to main      -> dev
#   manual dispatch   -> dev, test or prod (prod waits for the reviewers set on
#                        the "prod" GitHub environment)
#
# AWS access is through GitHub OIDC only. Two roles per environment come from
# infra/terraform/bootstrap:
#   <project>-<env>-plan    read-only, trusted from GitHub environment "<env>-plan"
#   <project>-<env>-deploy  can change the stack, trusted from GitHub environment "<env>"
#
# Repository configuration (Settings > Secrets and variables > Actions > Variables):
#   AWS_ACCOUNT_ID, AWS_REGION, TF_STATE_BUCKET, ARTIFACT_BUCKET
# Optional secrets on the dev and test environments, for the authenticated smoke
# test (prod only calls /v1/health, because it disables password sign-in):
#   SMOKE_USERNAME, SMOKE_PASSWORD (a Cognito user in a smoke-test tenant)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, test, prod]
        default: dev

permissions:
  contents: read

concurrency:
  # One deploy per environment at a time; a second one waits instead of racing
  # on the Terraform state (which is also locked).
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  TF_ROOT: infra/terraform/platform
  ARTIFACT_KEY: lambda/${{ github.sha }}/ragplatform.zip

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Build bundle
        id: bundle
        run: |
          uv run python scripts/build_lambda.py | tee build/build.log
          echo "sha256=$(grep '^sha256_base64=' build/build.log | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/ragplatform.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: build/ragplatform.zip
          retention-days: 7

  plan:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'dev' }}-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ragplatform-${{ env.ENVIRONMENT }}-plan
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
      - name: Plan
        run: |
          terraform -chdir="$TF_ROOT" init -input=false \
            -backend-config="../envs/$ENVIRONMENT.s3.tfbackend" \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform -chdir="$TF_ROOT" plan -input=false -out=tfplan \
            -var-file="../envs/$ENVIRONMENT.tfvars" \
            -var="account_id=${{ vars.AWS_ACCOUNT_ID }}" \
            -var="artifact_bucket=${{ vars.ARTIFACT_BUCKET }}" \
            -var="artifact_key=$ARTIFACT_KEY" \
            -var="artifact_sha256=${{ needs.build.outputs.sha256 }}"
          terraform -chdir="$TF_ROOT" show -no-color tfplan > plan.txt
      - name: Refuse plans that destroy protected data
        run: |
          # A replacement of the database, the documents bucket or the user pool
          # would lose data. Those changes need a human, not a pipeline.
          if terraform -chdir="$TF_ROOT" show -json tfplan | jq -e '
              [.resource_changes[]
               | select(.change.actions | index("delete"))
               | select(.type == "aws_rds_cluster" or .type == "aws_s3_bucket"
                        or .type == "aws_cognito_user_pool" or .type == "aws_kms_key")]
              | length > 0' > /dev/null; then
            echo "::error::The plan deletes or replaces a data-bearing resource. Apply it manually after review."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: |
            ${{ env.TF_ROOT }}/tfplan
            plan.txt
          retention-days: 1

  apply:
    needs: [build, plan]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ragplatform-${{ env.ENVIRONMENT }}-deploy
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: ${{ env.TF_ROOT }}
      - name: Upload bundle
        run: |
          aws s3 cp build/ragplatform.zip "s3://${{ vars.ARTIFACT_BUCKET }}/$ARTIFACT_KEY" --only-show-errors
      - name: Record live versions for rollback
        id: before
        run: |
          versions="{}"
          for fn in api ingest migrate; do
            v=$(aws lambda get-alias --function-name "ragplatform-$ENVIRONMENT-$fn" --name live \
                --query FunctionVersion --output text 2>/dev/null || echo "none")
            versions=$(jq -c --arg k "$fn" --arg v "$v" '. + {($k): $v}' <<< "$versions")
          done
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Live versions before deploy: $versions"
      - name: Apply
        run: |
          terraform -chdir="$TF_ROOT" init -input=false \
            -backend-config="../envs/$ENVIRONMENT.s3.tfbackend" \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform -chdir="$TF_ROOT" apply -input=false tfplan
          terraform -chdir="$TF_ROOT" output -json > outputs.json
      - name: Migrate database
        run: |
          fn=$(jq -r .migrate_function_name.value outputs.json)
          aws lambda invoke --function-name "$fn:live" --cli-read-timeout 310 \
            --payload '{}' --cli-binary-format raw-in-base64-out migrate.json > invoke.json
          cat migrate.json
          if jq -e '.FunctionError' invoke.json > /dev/null; then
            echo "::error::migration failed"; exit 1
          fi
      - name: Smoke test
        id: smoke
        env:
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          url=$(jq -r .api_url.value outputs.json)
          curl -sSf --retry 5 --retry-delay 3 "$url/v1/health"
          # Prod disables password sign-in (allow_password_auth = false) and requires
          # MFA, so USER_PASSWORD_AUTH cannot get a token there. Its smoke test stops at
          # /v1/health; ask a real question on dev and test.
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "prod: health check only, password sign-in is disabled"
          elif [ -n "$SMOKE_USERNAME" ]; then
            client=$(jq -r .user_pool_client_id.value outputs.json)
            token=$(aws cognito-idp initiate-auth --client-id "$client" --auth-flow USER_PASSWORD_AUTH \
                    --auth-parameters "USERNAME=$SMOKE_USERNAME,PASSWORD=$SMOKE_PASSWORD" \
                    --query AuthenticationResult.IdToken --output text)
            # Aurora may be resuming from 0 ACU: 503 with Retry-After is retried.
            for attempt in 1 2 3 4; do
              code=$(curl -s -o answer.json -w '%{http_code}' -X POST "$url/v1/query" \
                     -H "Authorization: $token" -H "Content-Type: application/json" \
                     -d '{"question": "What is this deployment smoke test checking?", "use_cache": false}')
              [ "$code" != "503" ] && break
              sleep 15
            done
            echo "query status $code"; jq '{status, model_id, latency_ms}' answer.json
            [ "$code" = "200" ]
          fi
      - name: Roll back aliases
        if: failure() && steps.before.outputs.versions != ''
        env:
          VERSIONS: ${{ steps.before.outputs.versions }}
        run: |
          echo "Deploy failed after apply; pointing aliases back to the previous versions."
          for fn in api ingest migrate; do
            v=$(jq -r --arg k "$fn" '.[$k]' <<< "$VERSIONS")
            if [ "$v" != "none" ] && [ "$v" != "null" ]; then
              aws lambda update-alias --function-name "ragplatform-$ENVIRONMENT-$fn" --name live \
                --function-version "$v" > /dev/null
              echo "$fn -> version $v"
            fi
          done
          echo "::warning::Terraform state still records the new versions. Re-run the deploy for the previous commit to reconcile, or fix forward."
